<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Daily Quote</title>

<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: #191919;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: "Times New Roman", serif;
  }

  .box {
    background: #000000;
    width: 220px;     /* significantly narrower */
    height: 140px;
    padding: 8px;     /* tighter padding */
    border-radius: 10px;

    display: flex;
    flex-direction: column;
    justify-content: space-between;

    position: relative;
    text-align: center;
  }

  .content {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;

    padding: 0;
  }

  .quote {
    color: white;
    font-size: 14px;
    line-height: 1.25;

    max-width: 200px; /* tighter text constraint */

    display: -webkit-box;
    -webkit-line-clamp: 3;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  .author {
    margin-top: 5px;
    color: white;
    font-size: 10.5px;
    opacity: 0.7;
  }

  button {
    position: absolute;
    bottom: 6px;
    left: 6px;

    background: #38294a;
    color: white;
    border: none;

    padding: 2px 6px;
    border-radius: 5px;
    font-size: 10px;
    cursor: pointer;
  }

  button:hover {
    opacity: 0.85;
  }
</style>
</head>

<body>

<div class="box">

  <div class="content">
    <div id="quote" class="quote"></div>
    <div id="author" class="author"></div>
  </div>

  <button onclick="setQuote(true)">reset</button>
</div>

<script>
const quotes = [
  {
    text: "that is the cruelest thing about fate. it is unmoved by your sacrifices.",
    author: "— vedrfolnir"
  },
  {
    text: "life is a gift. don't let darkness claim it.",
    author: "— skirk"
  },
  {
    text: "the moon was never meant to be a foreign realm...",
    author: "— zibai"
  },
  {
    text: "my head is full of poison, and my heart is full of doubt",
    author: "— olivia rodrigo"
  },
  {
    text: "...you know what will happen.",
    author: "— istaroth"
  }
];

function getSeed() {
  const today = new Date();
  return today.getFullYear() * 1000 + today.getMonth() * 100 + today.getDate();
}

function pickQuote(seed) {
  return quotes[seed % quotes.length];
}

function setQuote(isManual = false) {
  let seed = getSeed();

  if (isManual) {
    seed += Math.floor(Math.random() * 9999);
  }

  const q = pickQuote(seed);

  document.getElementById("quote").textContent = `"${q.text}"`;
  document.getElementById("author").textContent = q.author;
}

setQuote(false);
</script>

</body>
</html>
